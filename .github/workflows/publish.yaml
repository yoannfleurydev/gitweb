name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish_on_crates_io:
    name: Publish on crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Publish the crate
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN_GITWEB }}
      - name: Create Release
        run: gh release create "$TAG" --title "Release $TAG" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}

  release:
    needs: publish_on_crates_io
    name: ${{ matrix.name }} Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            binary: gitweb
            asset_name: gitweb-linux
          - name: Windows
            os: windows-latest
            binary: gitweb.exe
            asset_name: gitweb-windows.exe
          - name: MacOS
            os: macos-latest
            binary: gitweb
            asset_name: gitweb-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build
        run: cargo build --release
      - name: Upload Release Asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/$BINARY" "dist/$ASSET_NAME"
          gh release upload "$TAG" "dist/$ASSET_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BINARY: ${{ matrix.binary }}
          ASSET_NAME: ${{ matrix.asset_name }}
