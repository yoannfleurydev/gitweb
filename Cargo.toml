[package]
authors = ["Yoann Fleury <yoann.fleury@yahoo.com>"]
categories = ["command-line-utilities"]
description = "Open the current remote repository in your browser"
edition = "2021"
exclude = ["docs/", ".editorconfig", ".github/", "*.md"]
homepage = "https://github.com/yoannfleurydev/gitweb"
keywords = ["git", "browser"]
license = "Apache-2.0"
name = "gitweb"
readme = "README.md"
repository = "https://github.com/yoannfleurydev/gitweb"
version = "0.3.5"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
flexi_logger = "0.31"
git-url-parse = "0.6"
git2 = { version = "0.21", features = ["vendored-openssl"] }
log = "0.4"
open = "5.4"
thiserror = "2.0"
